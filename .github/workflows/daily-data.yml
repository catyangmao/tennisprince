name: daily-data
on:
  # 【暂停中】定时抓取已停,重启时取消下面两行注释即可
  # schedule:
  #   - cron: '17 2 * * *'   # 北京 10:17
  #   - cron: '17 10 * * *'  # 北京 18:17
  workflow_dispatch: {}  # 手动触发保留:Actions页可随时手动抓一次
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch tennis data
        run: node fetch-data.js
      - name: Commit if changed
        run: |
          git config user.name "tennis-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: $(date -u +%m-%d) update"
            git push
          fi
